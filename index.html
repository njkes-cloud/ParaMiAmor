<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveYou</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .animated-object {
            position: absolute;
            top: 10%;
            left: 30%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            animation: changeObject 5s infinite alternate ease-in-out;
        }
        .animated-object img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .animated-object img.show {
            opacity: 1;
        }
        
        @keyframes changeObject {
            0% { transform: translate(-50%, 0); }
            100% { transform: translate(-50%, 20px); }
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 300px;
            font-size: 20px;
            align-items: center;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .card.show {
            opacity: 1;
            transform: scale(1);
        }
        .image-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            position: relative;
            transition: opacity 1s ease-in-out;
        }
        .image-container img.show {
            opacity: 1;
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            background: #ff5e78;
            border: none;
            padding: 10px 20px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #ff3b5a;
        }
    </style>
</head>
<body>
    <div class="animated-object">
        <img id="animated-image" src="img/object1.png" alt="Animated Object" class="show">
    </div>
    <div class="card" id="card">
        <div class="image-container">
            <img id="card-image" src="img/image1.jpeg" alt="Love Image" class="show">
        </div>
        <p id="card-text">❤️ Люблю тебя больше, чем фиолетовый цвет! ❤️</p>
    </div>
    <div class="buttons">
        <button onclick="prevCard()">⬅ Назад</button>
        <button onclick="randomCard()">🎲</button>
        <button onclick="nextCard()">Вперёд ➡</button>
    </div>

    <script>
        const messages = [
            { text: "Когда ты рядом, мне не страшно жить ❤️", image: "img/image1.jpeg" },
            { text: "Когда мы вместе - все трудности решаются проще", image: "img/image2.jpeg" },
            { text: "Твоя улыбка способна заменить мне солнце", image: "img/image3.jpeg" },
            { text: "Я счастлива быть рядом с тобой!", image: "img/image4.jpeg" },
            { text: "Ты, конечно, большой, но все еще любименький!", image: "img/image5.jpeg" },
            { text: "Ты умеешь понимать меня, я это очень ценю!", image: "img/image6.jpeg" },
            { text: "Ты не то чтобы лучшее, что случалось в моей жизни, ты - моя лучшая жизнь", image: "img/image7.jpeg" },
            { text: "Я люблю тебя, Елисей!", image: "img/image8.jpeg" }
        ];
        const animatedImages = ["img/object1.png", "img/object2.png", "img/object3.png"];
        let index = 0;
        let animatedIndex = 0;
        const card = document.getElementById("card");
        const cardText = document.getElementById("card-text");
        const cardImage = document.getElementById("card-image");
        const animatedImage = document.getElementById("animated-image");

        function showMessage() {
            card.classList.remove("show");
            cardImage.classList.remove("show");
            setTimeout(() => {
                cardText.innerHTML = messages[index].text;
                cardImage.src = messages[index].image;
                card.classList.add("show");
                cardImage.classList.add("show");
            }, 200);
        }

        function nextCard() {
            index = (index + 1) % messages.length;
            showMessage();
        }

        function prevCard() {
            index = (index - 1 + messages.length) % messages.length;
            showMessage();
        }

        function randomCard() {
            index = Math.floor(Math.random() * messages.length);
            showMessage();
        }

        function changeAnimatedImage() {
            animatedIndex = (animatedIndex + 1) % animatedImages.length;
            animatedImage.src = animatedImages[animatedIndex];
        }

        setInterval(changeAnimatedImage, 500); // Менять изображение каждые 4 секунды
        showMessage();
    </script>
</body>
</html>
